name: foc

services:
  postgres:
    restart: unless-stopped
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data_prod:/var/lib/postgresql
      - ./infra/docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    restart: unless-stopped
    build:
      context: .
      target: user-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      FOC_USER_BUCKET: ${FOC_USER_BUCKET}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM}
      FOC_FRONTEND_URL: ${FOC_FRONTEND_URL:-https://localhost}
      FOC_DATABASE_URL: jdbc:postgresql://postgres:5432/foc_user
      FOC_DATABASE_USERNAME: ${POSTGRES_USER}
      FOC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      EVENTS_MESSAGING_TOPIC_ARN: ${USER_EVENTS_TOPIC_ARN}
    secrets:
      - jwt_private_key
      - jwt_public_key
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  admin-init:
    extends:
      service: user-service
    profiles: ["setup"]
    restart: "no"
    environment:
      SPRING_PROFILES_ACTIVE: prod,admin-init
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-System Administrator}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
    healthcheck:
      test: ["NONE"]

  supplier-service:
    restart: unless-stopped
    build:
      context: .
      target: supplier-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      FOC_JWKS_URI: http://user-service:8080/api/.well-known/jwks.json
      FOC_SUPPLIER_BUCKET: ${FOC_SUPPLIER_BUCKET}
      FOC_DATABASE_URL: jdbc:postgresql://postgres:5432/foc_supplier
      FOC_DATABASE_USERNAME: ${POSTGRES_USER}
      FOC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/api/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  supplier-seed:
    profiles: ["setup"]
    restart: "no"
    image: postgres:18-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: foc_supplier
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./infra/docker/postgres/seed-suppliers.sh:/scripts/seed-suppliers.sh:ro
      - ./data/csv:/seed:ro
    command: ["/bin/sh", "/scripts/seed-suppliers.sh", "/seed"]
    depends_on:
      postgres:
        condition: service_healthy
      supplier-service:
        condition: service_healthy

  order-service:
    restart: unless-stopped
    build:
      context: .
      target: order-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      FOC_JWKS_URI: http://user-service:8080/api/.well-known/jwks.json
      FOC_DATABASE_URL: jdbc:postgresql://postgres:5432/foc_order
      FOC_DATABASE_USERNAME: ${POSTGRES_USER}
      FOC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      EVENTS_MESSAGING_TOPIC_ARN: ${ORDER_EVENTS_TOPIC_ARN}
      EVENTS_MESSAGING_QUEUE_NAME: ${ORDER_EVENTS_QUEUE_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8082/api/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  credit-service:
    restart: unless-stopped
    build:
      context: .
      target: credit-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      FOC_JWKS_URI: http://user-service:8080/api/.well-known/jwks.json
      FOC_DATABASE_URL: jdbc:postgresql://postgres:5432/foc_credit
      FOC_DATABASE_USERNAME: ${POSTGRES_USER}
      FOC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      EVENTS_MESSAGING_TOPIC_ARN: ${CREDIT_EVENTS_TOPIC_ARN}
      EVENTS_MESSAGING_QUEUE_NAME: ${CREDIT_EVENTS_QUEUE_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8083/api/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  api-gateway:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./infra/docker/nginx/certs:/etc/nginx/certs
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "--output", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      user-service:
        condition: service_healthy
      supplier-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      credit-service:
        condition: service_healthy

volumes:
  pg_data_prod:

secrets:
  jwt_private_key:
    file: ${JWT_PRIVATE_KEY_FILE:-./secrets/jwt-private.pem}
  jwt_public_key:
    file: ${JWT_PUBLIC_KEY_FILE:-./secrets/jwt-public.pem}
