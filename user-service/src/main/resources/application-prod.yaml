spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=users
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
server:
  forward-headers-strategy: framework
auth:
  refresh-cookie-secure: true
  private-key-location: file:/run/secrets/jwt_private_key
  public-key-location: file:/run/secrets/jwt_public_key
account-mail:
  frontend-url: ${FOC_FRONTEND_URL:https://localhost}
events:
  messaging:
    topic-arn: ${EVENTS_MESSAGING_TOPIC_ARN}

storage:
  s3:
    bucket: ${FOC_USER_BUCKET}
