spring:
  cloud:
    aws:
      s3:
        endpoint: ${FOC_S3_ENDPOINT:}
        path-style-access-enabled: ${FOC_S3_PATH_STYLE:false}
  modulith:
    events:
      registry-trigger-annotation: org.springframework.modulith.events.ApplicationModuleListener
      completion-mode: delete
      republish-outstanding-events-on-restart: true
      jdbc:
        schema-initialization:
          enabled: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: user-service
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jpa:
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true
auth:
  access-token-ttl: 5m
  refresh-token-ttl: 30d
  refresh-cookie-secure: true
  private-key-location: classpath:keys/private.pem
  public-key-location: classpath:keys/public.pem
  key-id: user-service
server:
  servlet:
    context-path: /api
  port: 8080
account-mail:
  from: ${MAIL_FROM:no-reply@localhost}
  frontend-url: ${FOC_FRONTEND_URL:http://localhost:3000}
  token-ttl: 30m
  resend-interval: 60s
# Email delivery does not determine whether the API can serve requests.
management:
  otlp:
    metrics:
      export:
        enabled: false
  health:
    mail:
      enabled: false

storage:
  s3:
    bucket: ${FOC_USER_BUCKET:foc-dev-user}
  avatars:
    read-url-ttl: 10m
