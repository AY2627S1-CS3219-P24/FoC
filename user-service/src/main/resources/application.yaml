spring:
  application:
    name: user-service
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 5s
  cloud:
    stream:
      bindings:
        userCreated-out-0:
          destination: foc.user-created.v1
          content-type: application/json
          producer:
            required-groups: credit-provisioning
            error-channel-enabled: true
      rabbit:
        bindings:
          userCreated-out-0:
            producer:
              use-confirm-header: true
              delivery-mode: PERSISTENT
              exchange-durable: true
              exchange-auto-delete: false
              auto-bind-dlq: true
              dead-letter-exchange: ${spring.cloud.stream.bindings.userCreated-out-0.destination}.dlx
              dead-letter-routing-key: credit-provisioning
              dead-letter-queue-name: ${spring.cloud.stream.bindings.userCreated-out-0.destination}.credit-provisioning.retry
              dlq-ttl: 30000
              dlq-dead-letter-exchange: ${spring.cloud.stream.bindings.userCreated-out-0.destination}
              dlq-dead-letter-routing-key: ${spring.cloud.stream.bindings.userCreated-out-0.destination}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    default-schema: users
  threads:
    virtual:
      enabled: true
auth:
  access-token-ttl: 5m
  refresh-token-ttl: 30d
  refresh-cookie-secure: true
  private-key-location: classpath:keys/private.pem
  public-key-location: classpath:keys/public.pem
  key-id: user-service
server:
  servlet:
    context-path: /api
  port: 8080
avatar:
  directory: ${FOC_AVATAR_DIRECTORY:${user.home}/.foc/avatars}
