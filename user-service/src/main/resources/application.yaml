spring:
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: user-service
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    default-schema: users
  threads:
    virtual:
      enabled: true
auth:
  access-token-ttl: 5m
  refresh-token-ttl: 30d
  refresh-cookie-secure: true
  private-key-location: classpath:keys/private.pem
  public-key-location: classpath:keys/public.pem
  key-id: user-service
server:
  servlet:
    context-path: /api
  port: 8080
avatar:
  directory: ${FOC_AVATAR_DIRECTORY:${user.home}/.foc/avatars}
account-mail:
  from: ${MAIL_FROM:no-reply@localhost}
  frontend-url: ${FOC_FRONTEND_URL:http://localhost:3000}
  token-ttl: 30m
  resend-interval: 60s
# Email delivery does not determine whether the API can serve requests.
management:
  health:
    mail:
      enabled: false
