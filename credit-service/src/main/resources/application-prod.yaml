spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=credits
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://user-service:8080/api/.well-known/jwks.json
  flyway:
    default-schema: credits
server:
  forward-headers-strategy: framework
events:
  messaging:
    topic-arn: ${EVENTS_MESSAGING_TOPIC_ARN}
    queue-name: ${EVENTS_MESSAGING_QUEUE_NAME}
