spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: credit-service
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 5s
  cloud:
    function:
      definition: userCreated;errandCreationStarted;errandCancelled;errandExpired;errandCompleted
    stream:
      bindings:
        errandCreationStarted-in-0:
          destination: foc.errand-creation-started.v1
          group: credit-reservations
          content-type: application/json
          consumer:
            concurrency: 3
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-max-interval: 2000
            back-off-multiplier: 2.0
        creditReservationResult-out-0:
          destination: foc.credit-reservation-result.v1
          content-type: application/json
          producer:
            required-groups: order-credit-reservations
            error-channel-enabled: true
        errandCancelled-in-0:
          destination: foc.errand-cancelled.v1
          group: credit-settlements
          content-type: application/json
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-max-interval: 2000
        errandExpired-in-0:
          destination: foc.errand-expired.v1
          group: credit-settlements
          content-type: application/json
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-max-interval: 2000
        errandCompleted-in-0:
          destination: foc.errand-completed.v1
          group: credit-settlements
          content-type: application/json
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-max-interval: 2000
        creditSettlementResult-out-0:
          destination: foc.credit-settlement-result.v1
          content-type: application/json
          producer:
            required-groups: order-credit-settlements
            error-channel-enabled: true
        userCreated-in-0:
          destination: foc.user-created.v1
          group: credit-provisioning
          content-type: application/json
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-max-interval: 2000
      rabbit:
        bindings:
          errandCreationStarted-in-0:
            consumer:
              acknowledge-mode: AUTO
              prefetch: 1
              exchange-durable: true
              exchange-auto-delete: false
              auto-bind-dlq: true
              republish-to-dlq: false
              requeue-rejected: false
              dead-letter-exchange: ${spring.cloud.stream.bindings.errandCreationStarted-in-0.destination}.dlx
              dead-letter-routing-key: credit-reservations
              dead-letter-queue-name: ${spring.cloud.stream.bindings.errandCreationStarted-in-0.destination}.credit-reservations.dlq
          creditReservationResult-out-0:
            producer:
              use-confirm-header: true
              auto-bind-dlq: true
              dead-letter-exchange: ${spring.cloud.stream.bindings.creditReservationResult-out-0.destination}.dlx
              dead-letter-routing-key: order-credit-reservations
              dead-letter-queue-name: ${spring.cloud.stream.bindings.creditReservationResult-out-0.destination}.order-credit-reservations.dlq
              delivery-mode: PERSISTENT
              exchange-durable: true
              exchange-auto-delete: false
          errandCancelled-in-0:
            consumer:
              acknowledge-mode: AUTO
              prefetch: 10
              exchange-durable: true
              exchange-auto-delete: false
              auto-bind-dlq: true
              republish-to-dlq: false
              requeue-rejected: false
              dead-letter-exchange: ${spring.cloud.stream.bindings.errandCancelled-in-0.destination}.dlx
              dead-letter-routing-key: credit-settlements
              dead-letter-queue-name: ${spring.cloud.stream.bindings.errandCancelled-in-0.destination}.credit-settlements.dlq
          errandExpired-in-0:
            consumer:
              acknowledge-mode: AUTO
              prefetch: 10
              exchange-durable: true
              exchange-auto-delete: false
              auto-bind-dlq: true
              republish-to-dlq: false
              requeue-rejected: false
              dead-letter-exchange: ${spring.cloud.stream.bindings.errandExpired-in-0.destination}.dlx
              dead-letter-routing-key: credit-settlements
              dead-letter-queue-name: ${spring.cloud.stream.bindings.errandExpired-in-0.destination}.credit-settlements.dlq
          errandCompleted-in-0:
            consumer:
              acknowledge-mode: AUTO
              prefetch: 10
              exchange-durable: true
              exchange-auto-delete: false
              auto-bind-dlq: true
              republish-to-dlq: false
              requeue-rejected: false
              dead-letter-exchange: ${spring.cloud.stream.bindings.errandCompleted-in-0.destination}.dlx
              dead-letter-routing-key: credit-settlements
              dead-letter-queue-name: ${spring.cloud.stream.bindings.errandCompleted-in-0.destination}.credit-settlements.dlq
          creditSettlementResult-out-0:
            producer:
              use-confirm-header: true
              auto-bind-dlq: true
              dead-letter-exchange: ${spring.cloud.stream.bindings.creditSettlementResult-out-0.destination}.dlx
              dead-letter-routing-key: order-credit-settlements
              dead-letter-queue-name: ${spring.cloud.stream.bindings.creditSettlementResult-out-0.destination}.order-credit-settlements.dlq
              delivery-mode: PERSISTENT
              exchange-durable: true
              exchange-auto-delete: false
          userCreated-in-0:
            consumer:
              acknowledge-mode: AUTO
              prefetch: 10
              exchange-durable: true
              exchange-auto-delete: false
              auto-bind-dlq: true
              republish-to-dlq: false
              requeue-rejected: false
              dead-letter-exchange: ${spring.cloud.stream.bindings.userCreated-in-0.destination}.dlx
              dead-letter-routing-key: credit-provisioning
              dead-letter-queue-name: ${spring.cloud.stream.bindings.userCreated-in-0.destination}.credit-provisioning.dlq
  modulith:
    events:
      registry-trigger-annotation: org.springframework.modulith.events.ApplicationModuleListener
      completion-mode: delete
      republish-outstanding-events-on-restart: true
      jdbc:
        schema-initialization:
          enabled: false
      staleness:
        published: 1m
        processing: 1m
        resubmitted: 1m
        check-interval: 30s
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    default-schema: credits
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/api/.well-known/jwks.json
          jws-algorithms: ES256
credits:
  initial-allocation: 15
server:
  servlet:
    context-path: /api
  port: 8083
