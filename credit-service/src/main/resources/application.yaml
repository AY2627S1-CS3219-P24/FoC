spring:
  application:
    name: credit-service
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 5s
  cloud:
    function:
      definition: userCreated;errandSubmitted
    stream:
      bindings:
        errandSubmitted-in-0:
          destination: foc.errand-submitted.v1
          group: credit-reservations
          content-type: application/json
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-max-interval: 2000
        creditResult-out-0:
          destination: foc.credit-reservation-result.v1
          content-type: application/json
          producer:
            required-groups: order-credit-results
            error-channel-enabled: true
        userCreated-in-0:
          destination: foc.user-created.v1
          group: credit-provisioning
          content-type: application/json
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-max-interval: 2000
      rabbit:
        bindings:
          creditResult-out-0:
            producer:
              use-confirm-header: true
              delivery-mode: PERSISTENT
              exchange-durable: true
              exchange-auto-delete: false
          errandSubmitted-in-0:
            consumer:
              acknowledge-mode: AUTO
              prefetch: 10
              exchange-durable: true
              exchange-auto-delete: false
              auto-bind-dlq: true
              republish-to-dlq: false
              requeue-rejected: false
              dead-letter-exchange: ${spring.cloud.stream.bindings.errandSubmitted-in-0.destination}.dlx
              dead-letter-routing-key: credit-reservations
              dead-letter-queue-name: ${spring.cloud.stream.bindings.errandSubmitted-in-0.destination}.credit-reservations.retry
              dlq-ttl: 30000
              dlq-dead-letter-exchange: ${spring.cloud.stream.bindings.errandSubmitted-in-0.destination}
              dlq-dead-letter-routing-key: ${spring.cloud.stream.bindings.errandSubmitted-in-0.destination}
          userCreated-in-0:
            consumer:
              acknowledge-mode: AUTO
              prefetch: 10
              exchange-durable: true
              exchange-auto-delete: false
              auto-bind-dlq: true
              republish-to-dlq: false
              requeue-rejected: false
              dead-letter-exchange: ${spring.cloud.stream.bindings.userCreated-in-0.destination}.dlx
              dead-letter-routing-key: credit-provisioning
              dead-letter-queue-name: ${spring.cloud.stream.bindings.userCreated-in-0.destination}.credit-provisioning.retry
              dlq-ttl: 30000
              dlq-dead-letter-exchange: ${spring.cloud.stream.bindings.userCreated-in-0.destination}
              dlq-dead-letter-routing-key: ${spring.cloud.stream.bindings.userCreated-in-0.destination}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    default-schema: credits
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/api/.well-known/jwks.json
          jws-algorithms: ES256
server:
  servlet:
    context-path: /api
  port: 8083
