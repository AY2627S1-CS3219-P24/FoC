plugins {
    id 'base'
    id 'com.diffplug.spotless' version "8.10.2"
}


subprojects {
    plugins.withId('java') {
        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs.addAll('-Amapstruct.defaultComponentModel=spring')
        }
    }

    apply plugin: "com.diffplug.spotless"

    spotless {
        ratchetFrom 'origin/main'

        format 'misc', {
            target '*.gradle', '.gitattributes', '.gitignore'

            trimTrailingWhitespace()
            leadingTabsToSpaces()
            endWithNewline()
        }
        java {
            toggleOffOn()
            importOrder()
            removeUnusedImports()
            forbidModuleImports()
            shortenFullyQualifiedTypes()
            leadingTabsToSpaces()
            cleanthat()
            palantirJavaFormat()
            tableTestFormatter()
            formatAnnotations()
        }
    }
}

tasks.named('check') {
    dependsOn subprojects.collect { it.tasks.named('check') }
}

spotless {
    format 'gradle', {
        target 'build.gradle'
        trimTrailingWhitespace()
        leadingTabsToSpaces()
        endWithNewline()
    }
}
