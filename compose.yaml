services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres-db
    volumes:
      - pg_data:/var/lib/postgresql
    environment:
        - POSTGRES_DB=${POSTGRES_DB}
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
volumes:
  pg_data: