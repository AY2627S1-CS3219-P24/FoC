name: foc-dev

services:
  floci:
    image: floci/floci:2.3.0-compat
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_SERVICES_S3_ENFORCE_AUTH: "true"
      FLOCI_HOSTNAME: localhost
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      FOC_USER_BUCKET: ${FOC_USER_BUCKET:-foc-dev-user}
      FOC_SUPPLIER_BUCKET: ${FOC_SUPPLIER_BUCKET:-foc-dev-supplier}
    volumes:
      - floci_data:/app/data
      - ./docker/floci/init-storage.sh:/etc/localstack/init/ready.d/10-foc-storage.sh:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/foc-resources-ready"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql
volumes:
  floci_data:
  pg_data:
