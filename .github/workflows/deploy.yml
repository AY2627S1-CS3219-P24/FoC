name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        type: choice
        required: true
        default: all
        options:
          - all
          - user
          - supplier
          - order
          - credit
          - realtime
          - gateway

permissions:
  contents: read
  id-token: write

concurrency:
  group: foc-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  RELEASE_SHA: ${{ github.sha }}

jobs:
  select-services:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.select.outputs.services }}
    steps:
      - name: Select services
        id: select
        env:
          SELECTED_SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail

          services=$(jq -cn --arg selected "$SELECTED_SERVICE" '
            ["user", "supplier", "order", "credit", "realtime", "gateway"]
            | if $selected == "all" then .
              elif index($selected) != null then [$selected]
              else error("Unknown service: " + $selected)
              end
          ')
          echo "services=$services" >> "$GITHUB_OUTPUT"

  publish:
    needs: select-services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.select-services.outputs.services) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_ROLE }}
          aws-region: ap-southeast-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Select release image
        id: image
        env:
          SERVICE: ${{ matrix.service }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail

          prefix=$(sed -n 's/^name_prefix[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' infra/terraform/environments/prod/terraform.tfvars)

          echo "repository=$prefix/$SERVICE" >> "$GITHUB_OUTPUT"
          echo "tag=$REGISTRY/$prefix/$SERVICE:$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Reuse an existing immutable release image
        id: existing
        env:
          REPOSITORY: ${{ steps.image.outputs.repository }}
        run: |
          set -euo pipefail

          if digest=$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$RELEASE_SHA" --query 'imageDetails[0].imageDigest' --output text 2> "$RUNNER_TEMP/image-lookup.err"); then
            echo "Reusing $REPOSITORY:$RELEASE_SHA ($digest)"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif [[ $(cat "$RUNNER_TEMP/image-lookup.err") == *'(ImageNotFoundException)'* ]]; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/image-lookup.err" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.existing.outputs.exists == 'false'
      - uses: docker/build-push-action@v7
        if: steps.existing.outputs.exists == 'false'
        with:
          context: .
          file: ${{ matrix.service == 'gateway' && 'frontend/Dockerfile' || 'Dockerfile' }}
          target: ${{ matrix.service == 'gateway' && 'runtime' || format('{0}-service', matrix.service) }}
          build-args: ${{ matrix.service == 'gateway' && format('VITE_CARTO_API_KEY={0}', vars.VITE_CARTO_API_KEY) || '' }}
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: [select-services, publish]
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.select-services.outputs.services) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_ROLE }}
          aws-region: ap-southeast-1
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - name: Read Terraform task definitions
        id: deployment
        working-directory: infra/terraform/environments/prod
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          : "${TF_STATE_BUCKET:?Set the TF_STATE_BUCKET repository variable to the Terraform state bucket}"
          terraform init -input=false -lockfile=readonly -backend-config="bucket=${TF_STATE_BUCKET}"
          terraform output -json deployment > "$RUNNER_TEMP/deployment.json"

          jq -r --arg service "$SERVICE" --arg sha "$RELEASE_SHA" '
            "cluster=\(.cluster)",
            "task_definition=\(.task_definitions[$service])",
            "image=\(.repositories[$service]):\($sha)",
            "desired_count=\(.desired_count)"
          ' "$RUNNER_TEMP/deployment.json" >> "$GITHUB_OUTPUT"

      - name: Set release image
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-arn: ${{ steps.deployment.outputs.task_definition }}
          container-name: ${{ matrix.service }}
          image: ${{ steps.deployment.outputs.image }}

      - name: Deploy service
        id: release
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2.6.4
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          cluster: ${{ steps.deployment.outputs.cluster }}
          service: ${{ matrix.service }}
          desired-count: ${{ steps.deployment.outputs.desired_count }}
          wait-for-service-stability: ${{ steps.deployment.outputs.desired_count == '1' }}

      - name: Record release revision
        env:
          SERVICE: ${{ matrix.service }}
          TASK_DEFINITION: ${{ steps.release.outputs.task-definition-arn }}
          DESIRED_COUNT: ${{ steps.deployment.outputs.desired_count }}
          STATUS: ${{ steps.deployment.outputs.desired_count == '0' && 'Staged' || 'Deployed' }}
        run: echo "$STATUS $SERVICE — $TASK_DEFINITION (desired tasks $DESIRED_COUNT)" >> "$GITHUB_STEP_SUMMARY"

      - name: Print service events
        if: failure()
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          prefix=$(sed -n 's/^name_prefix[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' infra/terraform/environments/prod/terraform.tfvars)
          aws ecs describe-services --cluster "$prefix" --services "$SERVICE" \
            --query 'services[].{service:serviceName,events:events[:3]}'
