name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full Git commit SHA already merged into main
        type: string
        required: true
      build_images:
        description: Build and push images. Disable when redeploying an existing release or rolling back
        type: boolean
        default: true
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: foc-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: foc_test
          POSTGRES_USER: foc
          POSTGRES_PASSWORD: foc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foc -d foc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Require a release from main
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - uses: actions/checkout@v4
        if: inputs.build_images
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        if: inputs.build_images
        with:
          distribution: temurin
          java-version: "25"
      - name: Backend check
        if: inputs.build_images
        run: ./gradlew check --no-daemon
        env:
          CI: true
          FOC_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/foc_test
          FOC_TEST_DATABASE_USERNAME: foc
          FOC_TEST_DATABASE_PASSWORD: foc
      - uses: actions/setup-node@v4
        if: inputs.build_images
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        if: inputs.build_images
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        if: inputs.build_images
        working-directory: frontend
        run: npm run lint
      - name: Check frontend formatting
        if: inputs.build_images
        working-directory: frontend
        run: npm run check
      - name: Test frontend
        if: inputs.build_images
        working-directory: frontend
        run: npm run test:run
      - name: Build frontend
        if: inputs.build_images
        working-directory: frontend
        run: npm run build

  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user, supplier, order, credit, gateway]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_ROLE }}
          aws-region: ap-southeast-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Select image and Dockerfile
        id: image
        env:
          SERVICE: ${{ matrix.service }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          prefix=$(sed -n 's/^name_prefix[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' infra/terraform/environments/prod/terraform.tfvars)
          echo "repository=$prefix/$SERVICE" >> "$GITHUB_OUTPUT"
          echo "tag=$REGISTRY/$prefix/$SERVICE:$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          case "$SERVICE" in
            gateway) echo 'file=frontend/Dockerfile' >> "$GITHUB_OUTPUT"; echo 'target=runtime' >> "$GITHUB_OUTPUT" ;;
            *) echo 'file=Dockerfile' >> "$GITHUB_OUTPUT"; echo "target=$SERVICE-service" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: docker/setup-buildx-action@v3
        if: inputs.build_images
      - uses: docker/build-push-action@v6
        if: inputs.build_images
        with:
          context: .
          file: ${{ steps.image.outputs.file }}
          target: ${{ steps.image.outputs.target }}
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Require the release image to exist
        env:
          REPOSITORY: ${{ steps.image.outputs.repository }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$RELEASE_SHA" --query 'imageDetails[0].imageDigest' --output text

  deploy:
    needs: [test, publish]
    if: needs.test.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_ROLE }}
          aws-region: ap-southeast-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - name: Read Terraform task definitions
        working-directory: infra/terraform/environments/prod
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Set the TF_STATE_BUCKET repository variable to the Terraform state bucket}"
          terraform init -input=false -lockfile=readonly -backend-config="bucket=${TF_STATE_BUCKET}"
          terraform output -json deployment > "$RUNNER_TEMP/deployment.json"
      - name: Register task definitions and update services
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: bash .github/scripts/deploy-ecs.sh release "$RUNNER_TEMP/deployment.json" "$REGISTRY" "$RELEASE_SHA"
      - name: Print service events
        if: failure()
        run: |
          set -euo pipefail
          prefix=$(sed -n 's/^name_prefix[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' infra/terraform/environments/prod/terraform.tfvars)
          aws ecs describe-services --cluster "$prefix" --services user supplier order credit gateway \
            --query 'services[].{service:serviceName,events:events[:3]}'
