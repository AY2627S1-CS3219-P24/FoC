name: Set up databases

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Shared with infrastructure apply and Deploy; do not cancel a running apply.
concurrency:
  group: foc-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  setup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/terraform/environments/prod
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_ROLE }}
          aws-region: ap-southeast-1
      - name: Read deployment outputs
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Set the TF_STATE_BUCKET repository variable to the Terraform state bucket}"
          terraform init -input=false -lockfile=readonly -backend-config="bucket=${TF_STATE_BUCKET}"
          terraform output -json deployment > "$RUNNER_TEMP/deployment.json"
      - name: Create service databases
        run: bash "$GITHUB_WORKSPACE/.github/scripts/setup-databases.sh" "$RUNNER_TEMP/deployment.json"
