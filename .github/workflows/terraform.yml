name: Update infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Shared with Deploy and database setup; do not cancel a running apply.
concurrency:
  group: foc-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/environments/prod
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_ROLE }}
          aws-region: ap-southeast-1
      - name: Initialize existing remote state
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Set the TF_STATE_BUCKET repository variable to the Terraform state bucket}"
          terraform init -input=false -lockfile=readonly -backend-config="bucket=${TF_STATE_BUCKET}"
      - name: Require externally supplied JWT and mail settings
        run: |
          set -euo pipefail
          prefix=$(sed -n 's/^name_prefix[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' terraform.tfvars)
          for parameter in jwt-private-key jwt-public-key mail-username mail-password; do
            type=$(aws ssm describe-parameters --parameter-filters "Key=Name,Option=Equals,Values=$prefix-$parameter" --query 'Parameters[0].Type' --output text)
            if [ "$type" != SecureString ]; then
              echo "Create $prefix-$parameter as a SecureString before setup." >&2
              exit 1
            fi
          done
          start_services=$(sed -n 's/^start_services[[:space:]]*=[[:space:]]*\(true\|false\).*/\1/p' terraform.tfvars)
          if [ "$start_services" = true ]; then
            for parameter in grafana-otlp-url grafana-otlp-authorization; do
              type=$(aws ssm describe-parameters --parameter-filters "Key=Name,Option=Equals,Values=$prefix-$parameter" --query 'Parameters[0].Type' --output text)
              if [ "$type" != SecureString ]; then
                echo "Create $prefix-$parameter as a SecureString before starting services." >&2
                exit 1
              fi
            done
          fi
      - name: Prepare infrastructure plan
        run: |
          set -euo pipefail
          mkdir -p review
          terraform plan -input=false -lock-timeout=5m -out=review/plan.tfplan
          terraform show -no-color review/plan.tfplan > review/plan.txt
          printf 'Review the infrastructure plan artifact before approving the production job.\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat review/plan.txt >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: environment-plan
          path: infra/terraform/environments/prod/review/
          retention-days: 3

  apply:
    needs: plan
    runs-on: ubuntu-latest
    # Configure required reviewers on this GitHub environment.
    environment: production
    defaults:
      run:
        working-directory: infra/terraform/environments/prod
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_ROLE }}
          aws-region: ap-southeast-1
      - uses: actions/download-artifact@v4
        with:
          name: environment-plan
          path: infra/terraform/environments/prod/review
      - name: Apply the reviewed infrastructure plan
        run: |
          set -euo pipefail
          terraform init -input=false -lockfile=readonly -backend-config="bucket=${TF_STATE_BUCKET}"
          terraform apply -input=false -lock-timeout=5m review/plan.tfplan
