name: Initialize Admin

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: foc-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  initialize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_ROLE }}
          aws-region: ap-southeast-1
      - name: Initialize existing remote state
        working-directory: infra/terraform/environments/prod
        run: |
          set -euo pipefail

          : "${TF_STATE_BUCKET:?Set the TF_STATE_BUCKET repository variable to the Terraform state bucket}"
          terraform init -input=false -lockfile=readonly -backend-config="bucket=${TF_STATE_BUCKET}"
      - name: Initialize admin through User Service
        run: bash .github/scripts/init-admin.sh
