name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: foc_test
          POSTGRES_USER: foc
          POSTGRES_PASSWORD: foc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foc -d foc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: foc_test
          RABBITMQ_DEFAULT_PASS: foc_test
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: realtime-service/package-lock.json
      - name: Java Services check
        run: ./gradlew check --no-daemon
        env:
          CI: true
          FOC_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/foc_test
          FOC_TEST_DATABASE_USERNAME: foc
          FOC_TEST_DATABASE_PASSWORD: foc
          FOC_TEST_RABBIT_HOST: localhost
          FOC_TEST_RABBIT_PORT: "5672"
          FOC_TEST_RABBIT_USERNAME: foc_test
          FOC_TEST_RABBIT_PASSWORD: foc_test
      - name: Install realtime service dependencies
        working-directory: realtime-service
        run: npm ci
      - name: Test realtime service
        working-directory: realtime-service
        run: npm test
      - name: Build realtime service
        working-directory: realtime-service
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Check frontend formatting
        working-directory: frontend
        run: npm run check
      - name: Test frontend
        working-directory: frontend
        run: npm run test:run
      - name: Build frontend
        working-directory: frontend
        run: npm run build

