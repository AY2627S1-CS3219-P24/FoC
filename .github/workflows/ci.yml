name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spotless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Spotless check
        run: ./gradlew spotlessCheck --no-daemon
        env:
          CI: true
