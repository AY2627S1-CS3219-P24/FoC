name: Deploy Frontend

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: foc-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  RELEASE_SHA: ${{ github.sha }}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_ROLE }}
          aws-region: ap-southeast-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Select release image
        id: image
        env:
          SERVICE: gateway
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail

          prefix=$(sed -n 's/^name_prefix[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' infra/terraform/environments/prod/terraform.tfvars)

          echo "repository=$prefix/$SERVICE" >> "$GITHUB_OUTPUT"
          echo "tag=$REGISTRY/$prefix/$SERVICE:$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Reuse an existing immutable release image
        id: existing
        env:
          REPOSITORY: ${{ steps.image.outputs.repository }}
        run: |
          set -euo pipefail

          if digest=$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$RELEASE_SHA" --query 'imageDetails[0].imageDigest' --output text 2> "$RUNNER_TEMP/image-lookup.err"); then
            echo "Reusing $REPOSITORY:$RELEASE_SHA ($digest)"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif [[ $(cat "$RUNNER_TEMP/image-lookup.err") == *'(ImageNotFoundException)'* ]]; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/image-lookup.err" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.existing.outputs.exists == 'false'
      - uses: docker/build-push-action@v7
        if: steps.existing.outputs.exists == 'false'
        with:
          context: .
          file: frontend/Dockerfile
          target: runtime
          build-args: VITE_CARTO_API_KEY=${{ vars.VITE_CARTO_API_KEY }}
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_ROLE }}
          aws-region: ap-southeast-1
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - name: Read Terraform task definitions
        id: deployment
        working-directory: infra/terraform/environments/prod
        env:
          SERVICE: gateway
        run: |
          set -euo pipefail

          : "${TF_STATE_BUCKET:?Set the TF_STATE_BUCKET repository variable to the Terraform state bucket}"
          terraform init -input=false -lockfile=readonly -backend-config="bucket=${TF_STATE_BUCKET}"
          terraform output -json deployment > "$RUNNER_TEMP/deployment.json"

          jq -r --arg service "$SERVICE" --arg sha "$RELEASE_SHA" '
            "cluster=\(.cluster)",
            "task_definition=\(.task_definitions[$service])",
            "image=\(.repositories[$service]):\($sha)"
          ' "$RUNNER_TEMP/deployment.json" >> "$GITHUB_OUTPUT"

          cluster=$(jq -er '.cluster' "$RUNNER_TEMP/deployment.json")
          desired_count=$(aws ecs describe-services --cluster "$cluster" --services gateway \
            --query 'services[0].desiredCount' --output text)
          [[ "$desired_count" =~ ^[0-9]+$ ]] || { echo 'Could not read the live service task count.' >&2; exit 1; }
          echo "desired_count=$desired_count" >> "$GITHUB_OUTPUT"

      - name: Set release image
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-arn: ${{ steps.deployment.outputs.task_definition }}
          container-name: gateway
          image: ${{ steps.deployment.outputs.image }}

      - name: Deploy service
        id: release
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2.6.4
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          cluster: ${{ steps.deployment.outputs.cluster }}
          service: gateway
          desired-count: ${{ steps.deployment.outputs.desired_count }}
          wait-for-service-stability: ${{ steps.deployment.outputs.desired_count != '0' }}

      - name: Record release revision
        env:
          SERVICE: gateway
          TASK_DEFINITION: ${{ steps.release.outputs.task-definition-arn }}
          DESIRED_COUNT: ${{ steps.deployment.outputs.desired_count }}
          STATUS: ${{ steps.deployment.outputs.desired_count == '0' && 'Staged' || 'Deployed' }}
        run: echo "$STATUS $SERVICE — $TASK_DEFINITION (desired tasks $DESIRED_COUNT)" >> "$GITHUB_STEP_SUMMARY"

      - name: Print service events
        if: failure()
        env:
          SERVICE: gateway
        run: |
          set -euo pipefail

          prefix=$(sed -n 's/^name_prefix[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' infra/terraform/environments/prod/terraform.tfvars)
          aws ecs describe-services --cluster "$prefix" --services "$SERVICE" \
            --query 'services[].{service:serviceName,events:events[:3]}'
