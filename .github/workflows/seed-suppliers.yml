name: Seed Suppliers

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: foc-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  seed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/production-context
        with:
          role: ${{ vars.AWS_INFRASTRUCTURE_ROLE }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
      - name: Seed suppliers
        run: bash .github/scripts/run-setup-task.sh supplier-seed
