name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install browser OS dependencies
        run: ./gradlew :e2e-tests:installBrowserDependencies --no-daemon
      - name: End-to-end checks
        run: ./gradlew :e2e-tests:check --no-daemon
        env:
          CI: true
      - name: Upload E2E reports and browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e-tests/build/reports/tests/
            e2e-tests/build/test-results/
            e2e-tests/build/playwright/
