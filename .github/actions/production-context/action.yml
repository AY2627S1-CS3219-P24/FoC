name: Production context
description: Configure Terraform, AWS credentials, remote state and deployment outputs.
inputs:
  role:
    description: AWS role to assume through GitHub OIDC.
    required: true
  state-bucket:
    description: Existing Terraform state bucket.
    required: true
  read-outputs:
    description: Read deployment outputs from existing state.
    default: "true"
runs:
  using: composite
  steps:
    - name: Read Terraform version
      id: version
      shell: bash
      run: echo "terraform=$(cat "$GITHUB_WORKSPACE/.terraform-version")" >> "$GITHUB_OUTPUT"
    - uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ steps.version.outputs.terraform }}
        terraform_wrapper: false
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role }}
        aws-region: ap-southeast-1
    - name: Initialize production state
      shell: bash
      working-directory: ${{ github.workspace }}/infra/terraform/environments/prod
      env:
        STATE_BUCKET: ${{ inputs.state-bucket }}
        READ_OUTPUTS: ${{ inputs.read-outputs }}
      run: |
        set -euo pipefail
        : "${STATE_BUCKET:?Set TF_STATE_BUCKET to the Terraform state bucket}"
        terraform init -input=false -lockfile=readonly -backend-config="bucket=$STATE_BUCKET"
        if [[ "$READ_OUTPUTS" == true ]]; then
          terraform output -json deployment > "$RUNNER_TEMP/deployment.json"
        fi
