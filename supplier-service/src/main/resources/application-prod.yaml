spring:
  datasource:
    url: ${FOC_DATABASE_URL}
    username: ${FOC_DATABASE_USERNAME}
    password: ${FOC_DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${FOC_JWKS_URI}
server:
  forward-headers-strategy: framework
management:
  opentelemetry:
    resource-attributes:
      "[service.instance.id]": ${HOSTNAME}
storage:
  s3:
    bucket: ${FOC_SUPPLIER_BUCKET}
