spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=suppliers
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://user-service:8080/api/.well-known/jwks.json
  flyway:
    default-schema: suppliers
server:
  forward-headers-strategy: framework

storage:
  s3:
    bucket: ${FOC_SUPPLIER_BUCKET}
