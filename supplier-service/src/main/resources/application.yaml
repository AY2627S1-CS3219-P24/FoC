spring:
  application:
    name: supplier-service
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    default-schema: suppliers
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/api/.well-known/jwks.json
          jws-algorithms: ES256
server:
  servlet:
    context-path: /api
  port: 8081
