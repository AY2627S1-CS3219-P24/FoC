spring:
  application:
    name: supplier-service
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    default-schema: suppliers
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/api/.well-known/jwks.json
          jws-algorithms: ES256
server:
  servlet:
    context-path: /api
  port: 8081
supplier:
  images:
    directory: ${FOC_SUPPLIER_IMAGE_DIRECTORY:${user.home}/.foc/supplier-images}
