spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=orders
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://user-service:8080/api/.well-known/jwks.json
  flyway:
    default-schema: orders
server:
  forward-headers-strategy: framework
services:
  credit-url: http://credit-service:8083/api
  supplier-url: http://supplier-service:8081/api
  user-url: http://user-service:8080/api
events:
  messaging:
    topic-arn: ${EVENTS_MESSAGING_TOPIC_ARN}
    queue-name: ${EVENTS_MESSAGING_QUEUE_NAME}
