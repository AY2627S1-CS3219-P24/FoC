spring:
  datasource:
    url: ${FOC_DATABASE_URL}
    username: ${FOC_DATABASE_USERNAME}
    password: ${FOC_DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${FOC_JWKS_URI}
server:
  forward-headers-strategy: framework
services:
  credit-url: http://credit-service:8083/api
  supplier-url: http://supplier-service:8081/api
  user-url: http://user-service:8080/api
events:
  messaging:
    topic-arn: ${EVENTS_MESSAGING_TOPIC_ARN}
    queue-name: ${EVENTS_MESSAGING_QUEUE_NAME}
management:
  opentelemetry:
    resource-attributes:
      "[service.instance.id]": ${HOSTNAME}
