spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: order-service
  cloud:
    aws:
      sqs:
        queue-not-found-strategy: fail
  modulith:
    events:
      registry-trigger-annotation: org.springframework.modulith.events.ApplicationModuleListener
      completion-mode: delete
      republish-outstanding-events-on-restart: true
      jdbc:
        schema-initialization:
          enabled: false
      staleness:
        published: 1m
        processing: 1m
        resubmitted: 1m
        check-interval: 30s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    default-schema: orders
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/api/.well-known/jwks.json
          jws-algorithms: ES256
server:
  servlet:
    context-path: /api
  port: 8082
orders:
  expiry-scan-delay: 10s
  expiry-batch-size: 100
events:
  messaging:
    topic-arn: arn:aws:sns:ap-southeast-1:000000000000:foc-dev-order-events
    queue-name: foc-dev-order-events
