spring:
  main:
    banner-mode: "off"
  cloud:
    aws:
      region:
        static: ap-southeast-1
      s3:
        enabled: false
      sqs:
        listener:
          poll-timeout: 1s
      credentials:
        access-key: test
        secret-key: test
  modulith:
    events:
      staleness:
        published: 0s
        processing: 0s
        resubmitted: 0s
server:
  port: 0
logging:
  level:
    root: WARN
orders:
  expiry-scan-delay: 1h

events:
  publication:
    retry-delay: 200ms
  messaging:
    topic-arn: arn:aws:sns:ap-southeast-1:000000000000:foc-test-order-events
    queue-name: foc-test-order-events
